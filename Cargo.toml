[package]
name = "agentwiki"
version = "0.6.0"
edition = "2024"
description = "CLI-agent-native C4 documentation generator (deepwiki-rs rewrite)"
authors = ["tidusvn05 <tidusv05@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tidusvn05/agentwiki"
homepage = "https://github.com/tidusvn05/agentwiki"
readme = "README.md"
keywords = ["documentation", "c4", "architecture", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
glob = "0.3.4"
hex = "0.4.3"
indicatif = "0.18.6"
regex = "1.13.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "process",
    "macros",
    "time",
    "sync",
    "fs",
    "io-util",
    "signal",
] }
tokio-util = "0.7.19"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_fs = "1.1.4"
tempfile = "3.27.0"
