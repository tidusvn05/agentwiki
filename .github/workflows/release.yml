name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: generate changelog
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "## What's Changed"
            echo
            if [ -n "$prev" ]; then
              range="${prev}..HEAD"
            fi
            git log --no-merges \
              --pretty=format:'- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))' \
              $range
            echo
            if [ -n "$prev" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev}...${{ github.ref_name }}"
            fi
          } > RELEASE_NOTES.md

      - name: create GitHub release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "agentwiki ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          strip agentwiki
          tar -czf "$GITHUB_WORKSPACE/agentwiki-${{ matrix.target }}.tar.gz" agentwiki

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive "target/${{ matrix.target }}/release/agentwiki.exe" "agentwiki-${{ matrix.target }}.zip"

      - name: upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" agentwiki-${{ matrix.target }}.* --clobber
